name: Daily Stock Data Collector & Drive Sync

on:
  schedule:
    # 日本時間の月〜金曜日 18:00 に自動実行 (UTC 09:00)
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance openpyxl requests numpy xlrd

      - name: 株価データの取得・バックテストプログラムを実行
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: python main.py
